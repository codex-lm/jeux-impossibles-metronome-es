function majInfoPhase(){
  const el = document.getElementById("info-phase");
  let phase = "", detail = "";
  if(G.ecran === "accueil"){
    phase = T("hudAccueil");
    detail = T("hudAccueilDetail");
  }else if(G.ecran === "passe"){
    if(G.mode === "ia"){
      phase = T("hudPasseIa", { nom:nomSpan(G.passeJoueur) });
      detail = T("hudPasseIaDetail");
    }else{
      phase = T("hudPasse", { nom:nomSpan(G.passeJoueur) });
      detail = T("hudPasseDetail");
    }
  }else if(G.ecran === "prog"){
    phase = T("hudProg", { nom:nomSpan(G.joueurActif), toi:(G.mode === "ligne" ? T("toi") : "") });
    detail = (G.mode === "ligne") ? T("hudProgDetailLigne") : T("hudProgDetail");
  }else if(G.ecran === "attente"){
    phase = (G.attente && G.attente.key) ? T(G.attente.key, G.attente.vars) : T("enAttente");
    if(G.mode === "ia") detail = T("hudAttenteIaDetail");
    else if(G.mode === "ligne") detail = T("hudAttenteLigneDetail");
    else detail = "";
  }else if(G.ecran === "resolution"){
    phase = T("hudResolution", { n:G.resTic + 1 });
    detail = T("hudResolutionDetail");
  }else{
    const v = G.vainqueur;
    if(v){
      phase = v.joueur ? T("emporte", { nom:nomSpan(v.joueur) }) : T("egaliteCourt");
      detail = v.raison;
    }else{ phase = T("partieTerminee"); detail = ""; }
  }
  el.innerHTML = '<div class="mesure">' + T("mesureLbl", { n:G.mesure }) + "</div>" +
    '<div class="phase">' + phase + '</div><div class="detail">' + detail + "</div>" +
    '<div class="timer-ligne' + (G.timer.reste <= 5000 && G.timer.actif === true ? " timer-alerte" : "") + '" id="timer-ligne" style="display:' + (G.ecran === "prog" ? "flex" : "none") + '">' +
    '<div class="timer-bar"><div id="timer-fill"></div></div><span id="timer-txt"></span></div>' +
    '<div class="durees">' + T("timerLbl") + " " + DUREES_TIMER.map(function(d){
      return '<button class="duree-btn' + (G.timer.duree === d.ms ? " actif" : "") + '" data-ms="' + d.ms + '">' + d.lbl + "</button>";
    }).join("") + "</div>";
  majTimerAffichage();
}
function majTimerAffichage(){
  const fill = document.getElementById("timer-fill");
  const txt = document.getElementById("timer-txt");
  if(!fill || !txt) return;
  const frac = Math.max(0, Math.min(1, G.timer.reste / G.timer.duree));
  fill.style.width = (frac * 100).toFixed(1) + "%";
  const s = Math.ceil(G.timer.reste / 1000);
  txt.textContent = "0:" + (s < 10 ? "0" : "") + s;
  const ligne = document.getElementById("timer-ligne");
  if(ligne) ligne.classList.toggle("timer-alerte", G.timer.actif === true && G.timer.reste <= 5000);
}
function majZoneProg(){
  const el = document.getElementById("zone-prog");
  if(G.ecran !== "prog" || !G.joueurActif){ el.innerHTML = ""; return; }
  const j = G.joueurActif;
  const vivantes = piecesDe(j);
  let html = '<div class="prog-grille"><div></div>' +
    '<div class="pg-head">' + T("tic", { n:1 }) + '</div><div class="pg-head">' + T("tic", { n:2 }) + '</div><div class="pg-head">' + T("tic", { n:3 }) + "</div>";
  for(const p of vivantes){
    html += '<div class="pg-label"><span class="pt ' + j + '"></span>' + T("metronomeLbl", { n:p.id.slice(1) }) +
      ' <span class="coord">(' + p.q + ", " + p.r + ")</span></div>";
    for(let t = 0; t < 3; t++){
      const d = G.ordres[j][p.id] ? G.ordres[j][p.id][t] : null;
      const actif = G.saisie.id === p.id && G.saisie.tic === t;
      let contenu;
      if(d === null || d === undefined) contenu = '<span>·</span>';
      else if(d < 0) contenu = '<span style="color:var(--encre); font-size:15px;">—</span>';
      else contenu = svgFlecheCellule(d, 22);
      html += '<button class="pg-cell' + (actif ? " actif" : "") + '" data-pid="' + p.id + '" data-tic="' + t +
        '" title="' + T("tic", { n:t + 1 }) + '">' + contenu + "</button>";
    }
  }
  html += "</div>";
  /* Pavé directionnel. */
  const zones = [["nw", 2], ["ne", 1], ["w", 3], ["rst", -1], ["e", 0], ["sw", 4], ["se", 5]];
  html += '<div class="pave">';
  for(const z of zones){
    html += '<button data-d="' + z[1] + '" style="grid-area:' + z[0] + '" title="' +
      (z[1] < 0 ? T("rester") : T("dirs")[z[1]]) + '">' +
      (z[1] < 0 ? '<span class="rst">—</span>' : svgFlecheCellule(z[1], 24)) + "</button>";
  }
  html += "</div>";
  html += '<button class="primaire" id="btn-valider">' + T("valider") + "</button>";
  html += '<div class="aide">' + T("aideProg") + "</div>";
  el.innerHTML = html;
}
function majZoneRevele(){
  const el = document.getElementById("zone-revele");
  if(G.ecran !== "resolution" && G.ecran !== "fin"){ el.innerHTML = ""; return; }
  let html = "";
  for(const j of ["azur", "corail"]){
    const ords = G.ordres[j];
    const ids = Object.keys(ords).sort();
    html += '<div class="rev-bloc"><div class="rev-titre j-' + j + '">' + T("programmeLbl", { nom:NOM_JOUEUR[j] }) + "</div>";
    for(const id of ids){
      const vivante = G.pieces.some(function(p){ return p.id === id; });
      html += '<div class="rev-ligne" style="' + (vivante ? "" : "opacity:.45;") + '"><span class="pt ' + j + '"></span>' + id;
      for(let t = 0; t < 3; t++){
        const d = ords[id][t];
        const cls = "fl" + (G.ecran === "resolution" ? (t < G.resTic ? " fait" : (t === G.resTic ? " courant" : "")) : " fait");
        html += '<span class="' + cls + '">' + (d < 0 ? '<span style="color:var(--encre); font-size:13px;">—</span>' : svgFlecheCellule(d, 18)) + "</span>";
      }
      html += "</div>";
    }
    html += "</div>";
  }
  el.innerHTML = html;
}

/* ---------- Saisie ---------- */
function choisirDirection(d){
  if(G.ecran !== "prog" || !G.joueurActif) return;
  const j = G.joueurActif;
  if(!G.saisie.id || !G.ordres[j][G.saisie.id]) return;
  G.ordres[j][G.saisie.id][G.saisie.tic] = d;
  /* Auto-avance : tic suivant, puis pièce suivante. */
  const ids = piecesDe(j).map(function(p){ return p.id; });
  const i = ids.indexOf(G.saisie.id);
  if(G.saisie.tic < 2){ G.saisie.tic++; }
  else if(i >= 0 && i < ids.length - 1){ G.saisie = { id:ids[i + 1], tic:0 }; }
  majUI();
}
function surbrillancePave(d){

/* ---------- Interactions canvas ---------- */
canvas.addEventListener("mousemove", function(ev){
  const rect = canvas.getBoundingClientRect();
  const hex = pixToHex(ev.clientX - rect.left, ev.clientY - rect.top);
  G.hoverHex = CORE.dansPlateau(hex.q, hex.r) ? hex : null;
  /* Curseur + surbrillance du pavé selon la direction pointée. */
  let actionnable = false, dirPointee = null;
  if(G.ecran === "prog" && G.joueurActif && G.saisie.id){
    const piece = G.pieces.find(function(p){ return p.id === G.saisie.id && p.joueur === G.joueurActif; });
    if(piece){
      const cum = positionsCumulees(piece, G.ordres[G.joueurActif]);
      const base = cum[G.saisie.tic];
      if(CORE.dansPlateau(base.q, base.r) && G.hoverHex){
        if(G.hoverHex.q === base.q && G.hoverHex.r === base.r){ actionnable = true; dirPointee = -1; }
        else for(let d = 0; d < 6; d++){
          if(G.hoverHex.q === base.q + CORE.DIRS[d].q && G.hoverHex.r === base.r + CORE.DIRS[d].r){
            actionnable = true; dirPointee = d; break;
          }
        }
      }
    }
  }
  canvas.style.cursor = actionnable ? "pointer" : "default";
  if(dirPointee !== null) surbrillancePave(dirPointee);
  else if(G.ecran === "prog") surbrillancePave(null);
});
canvas.addEventListener("mouseleave", function(){
  G.hoverHex = null;
  canvas.style.cursor = "default";
  if(G.ecran === "prog") surbrillancePave(null);
});
canvas.addEventListener("click", function(ev){
  if(G.ecran !== "prog" || !G.joueurActif || !G.saisie.id) return;
  const rect = canvas.getBoundingClientRect();
  const hex = pixToHex(ev.clientX - rect.left, ev.clientY - rect.top);
  if(!CORE.dansPlateau(hex.q, hex.r)) return;
  const j = G.joueurActif;
  /* Clic sur une de ses pièces : la sélectionner. */
  const clicPiece = G.pieces.find(function(p){ return p.joueur === j && p.q === hex.q && p.r === hex.r; });
  if(clicPiece){
    /* Première cellule non saisie de cette pièce, sinon tic 1. */
    let tic = 0;
    const o = G.ordres[j][clicPiece.id];
    if(o) for(let t = 0; t < 3; t++){ if(o[t] === null || o[t] === undefined){ tic = t; break; } }
    G.saisie = { id:clicPiece.id, tic:tic };
    majUI(); return;
  }
  const piece = G.pieces.find(function(p){ return p.id === G.saisie.id && p.joueur === j; });
  if(!piece) return;
  const cum = positionsCumulees(piece, G.ordres[j]);
  const base = cum[G.saisie.tic];
  if(!CORE.dansPlateau(base.q, base.r)) return;
  if(hex.q === base.q && hex.r === base.r){ choisirDirection(-1); return; } // rester
  for(let d = 0; d < 6; d++){
    if(hex.q === base.q + CORE.DIRS[d].q && hex.r === base.r + CORE.DIRS[d].r){
      choisirDirection(d); return;
    }
  }
});
/* Tactile : mapper le toucher sur le même traitement que le clic. */
canvas.addEventListener("touchstart", function(ev){
  if(ev.touches.length !== 1) return;
  const t = ev.touches[0];
  const rect = canvas.getBoundingClientRect();
  const hex = pixToHex(t.clientX - rect.left, t.clientY - rect.top);
  G.hoverHex = CORE.dansPlateau(hex.q, hex.r) ? hex : null;
}, { passive:true });

/* ---------- Boucle de rendu ---------- */
function boucle(now){
  majTimer(now);
  /* Fin d’animation d’un tic -> appliquer, enchaîner. */
  if(G.anim && now - G.anim.debut >= G.anim.duree){
    /* Laisse un court instant final aux effets. */
    if(!G.animApres){ G.animApres = now + 120; }
    else if(now >= G.animApres){
      G.animApres = null;
      appliquerTic();
      if(G.ecran === "resolution" || G.ecran === "fin") majUI();
    }
  }
  dessiner(now);
  if(G.ecran === "prog") majTimerAffichage();
  requestAnimationFrame(boucle);
}

/* ---------- Initialisation ---------- */
redimensionner();
appliquerLangue();
retourAccueil();
requestAnimationFrame(boucle);
</script>
